<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}شحنك{% endblock %}</title>
    <style>
        :root {
            --blue-1: #0B5ED7;
            --blue-2: #1677FF;
            --blue-3: #4FA3FF;
            --orange: #FF8A3D;
            --bg: #0e1420;
            --card-bg: rgba(255,255,255,0.06);
            --text: #ffffff;
            --text-dim: #a7b3c6;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Tahoma', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, var(--blue-1), var(--blue-2) 50%, var(--blue-3));
            min-height: 100vh;
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
        }
        .navbar {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .navbar .logo {
            font-weight: bold;
            font-size: 1.3rem;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            background: rgba(255,255,255,0.15);
            padding: 8px 14px;
            border-radius: 999px;
        }
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 28px 24px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
        }
        h1 { font-size: 1.4rem; margin: 0 0 6px; }
        p.subtitle { color: var(--text-dim); margin: 0 0 24px; font-size: 0.9rem; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-dim); }
        input {
            width: 100%;
            padding: 13px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-size: 1rem;
            margin-bottom: 16px;
        }
        input::placeholder { color: rgba(255,255,255,0.4); }
        button {
            width: 100%;
            padding: 14px;
            border-radius: 999px;
            border: none;
            background: linear-gradient(135deg, var(--blue-3), var(--blue-1));
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.15s ease;
        }
        button:active { transform: scale(0.96); }
        .switch-link {
            text-align: center;
            margin-top: 18px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .switch-link a { color: var(--blue-3); text-decoration: none; font-weight: bold; }
        .flash {
            background: rgba(255,255,255,0.12);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 0.9rem;
        }
        .flash.error { border-right: 4px solid #ff5c5c; }
        .flash.success { border-right: 4px solid #4ade80; }
        .wallet-badge {
            background: rgba(255,255,255,0.12);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            margin-bottom: 18px;
        }
        .wallet-badge .amount { font-size: 1.8rem; font-weight: bold; }
        .wallet-badge .label { color: var(--text-dim); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">👻 شحنك</div>
        {% if current_user.is_authenticated %}
            <a href="{{ url_for('auth.logout') }}">تسجيل الخروج</a>
        {% endif %}
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="card" style="max-width:420px; margin-bottom:12px; padding:14px 18px;">
                    <div class="flash {{ category }}">{{ message }}</div>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</body>
</html>
