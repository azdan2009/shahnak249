{% extends "base.html" %}
{% block title %}تسجيل الدخول - شحنك{% endblock %}
{% block content %}
<div class="card">
    <h1>تسجيل الدخول</h1>
    <p class="subtitle">كل شحناتك في مكان واحد</p>

    <form method="POST">
        {{ form.hidden_tag() }}

        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required autocomplete="username">

        <label for="password">كلمة المرور</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">

        <button type="submit">دخول</button>
    </form>

    <div class="switch-link">
        ماعندكش حساب؟ <a href="{{ url_for('auth.register') }}">أنشئ حساب جديد</a>
    </div>
</div>
{% endblock %}
